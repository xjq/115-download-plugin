<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 300px; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f8fafc; color: #1f2937; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: linear-gradient(135deg, #2BD06B, #0FA958); color: #fff; }
  header img { width: 30px; height: 30px; border-radius: 8px; background: #fff; }
  header h1 { font-size: 15px; font-weight: 700; }
  .card { margin: 12px; padding: 12px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #d1d5db; flex: none; }
  .dot.ok { background: #10b981; box-shadow: 0 0 6px rgba(16,185,129,.8); }
  .dot.err { background: #ef4444; }
  .uid { color: #6b7280; font-size: 12px; margin-top: 4px; margin-left: 18px; }
  .scan { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  button { border: 1px solid #d1d5db; background: #fff; color: #374151; border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; transition: all .15s; }
  button:hover { border-color: #0FA958; color: #0FA958; }
  button.primary { background: #0FA958; border-color: #0FA958; color: #fff; }
  button.primary:hover { background: #0c8f4c; }
  .scan-result { font-size: 12px; color: #6b7280; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid .wide { grid-column: 1 / -1; }
  footer { padding: 10px 16px 14px; font-size: 11px; color: #9ca3af; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <h1>115 磁力离线助手</h1>
  </header>
  <div class="card">
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">正在检查登录状态…</span></div>
    <div class="uid" id="uidText"></div>
    <div class="scan">
      <button id="rescan" class="primary">重新扫描当前页</button>
      <span class="scan-result" id="scanResult"></span>
    </div>
  </div>
  <div class="card grid">
    <button id="openTasks">离线任务列表</button>
    <button id="open115">打开 115 网盘</button>
    <button id="openSettings" class="wide">扩展设置</button>
  </div>
  <footer>在浏览器中登录 115 网页版即可使用<br>本地直连 115 官方接口，不经过任何第三方服务器</footer>
  <script src="popup.js"></script>
</body>
</html>
